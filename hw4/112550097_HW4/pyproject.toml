[project]
name = "promptir-hw4"
version = "0.1.0"
description = "PromptIR for All-in-One Image Restoration (DLCV HW4)"
requires-python = ">=3.10"

dependencies = [
    # Core
    "torch>=2.0",
    "torchvision>=0.15",
    "lightning>=2.0",
    "python-dotenv>=1.0",

    # Model
    "einops>=0.6",

    # Data & metrics
    "numpy>=1.24",
    "Pillow>=9.0",
    "scikit-image>=0.20",

    # Logging
    "tensorboard>=2.12",
    "tqdm>=4.65",
]

[project.optional-dependencies]
wandb = ["wandb>=0.15"]
dev = [
    "flake8>=6.0",
    "black>=23.0",
    "isort>=5.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# ── uv ────────────────────────────────────────────────────────────────────── #

[tool.uv]
# Use PyTorch index for CUDA wheels
extra-index-url = [
    "https://download.pytorch.org/whl/cu128",
]
package = false
# ── Formatting & Linting ──────────────────────────────────────────────────── #

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.isort]
profile = "black"
line_length = 100

[tool.flake8]
max-line-length = 100
extend-ignore = ["E203", "W503"]

# Hatch build: 指定 wheel 要包含的套件資料夾，避免 hatchling 無法推斷要打包哪些檔案
[tool.hatch.build.targets.wheel]